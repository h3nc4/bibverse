sonar.projectKey=bibverse
sonar.projectName=bibverse
sonar.projectVersion=0.0.0

# Read by the shared scan, so a pre-push run and CI hold this project to one gate.
h3nc4.gate=h3nc4

sonar.sources=.
sonar.tests=.
sonar.exclusions=**/*_test.go
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out

# main.go only wires the real client to stdout, so a test of it would assert against the live site.
sonar.coverage.exclusions=cmd/bibverse/main.go

sonar.sourceEncoding=UTF-8

