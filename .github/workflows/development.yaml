name: bibverse Development CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
      - "deps"
  schedule:
    - cron: "0 7 * * *" # daily at 07:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Format and test
    runs-on: ubuntu-latest
    container:
      image: golang:1.27.4@sha256:5f1b98fa02fe396ebce2a0227a0e08309e11792915b9dd2e1f71053d7e7e6666
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -d .
            exit 1
          fi
      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: Print the live verse from a static build
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags="-s -w" -o bibverse ./cmd/bibverse
          verse="$(./bibverse)"
          if [ -z "${verse}" ]; then
            echo "::error::bibverse printed nothing"
            exit 1
          fi
          echo "${verse}"
      - name: Run actions/upload-artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: code-coverage
          path: coverage.out
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      image: golangci/golangci-lint:v2.15@sha256:fbfcfd12a6f8d7f1b97b3362ca80fc2a244d46863148c73cb88e7793af96c481
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run golangci-lint
        run: golangci-lint run ./...
        env:
          GOFLAGS: -buildvcs=false

  deb:
    name: Build the Debian packages
    runs-on: ubuntu-latest
    container:
      image: golang:1.27.4@sha256:5f1b98fa02fe396ebce2a0227a0e08309e11792915b9dd2e1f71053d7e7e6666
    steps:
      - name: Install lintian
        run: |
          apt-get update
          apt-get install -y --no-install-recommends lintian
          git config --system --add safe.directory '*'
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Build the packages
        run: |
          ./scripts/deb.sh amd64
          ./scripts/deb.sh arm64
      - name: Run lintian
        run: lintian --fail-on error,warning --pedantic dist/*.deb
      - name: Run actions/upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deb
          path: dist/bibverse_*_amd64.deb
          if-no-files-found: error

  check-deb:
    name: Check the package on ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: deb
    strategy:
      matrix:
        image:
          - debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
          - devuan/devuan:excalibur@sha256:e0f3f31d6137c9dba7441c44b4a92b4dafe5f8978b9ff389224a8120cab03e55
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Run actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: deb
      - name: Install, run and purge the package
        run: |
          apt-get update
          apt-get install -y ./bibverse_*_amd64.deb
          bibverse
          apt-get purge -y bibverse
          if [ -e /usr/bin/bibverse ]; then
            echo "::error::purge left /usr/bin/bibverse behind"
            exit 1
          fi

  sonarqube:
    name: SonarQube Scan
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run actions/download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: code-coverage
      - name: Run h3nc4/sonar-action
        uses: h3nc4/sonar-action@c10bc623edc7c789ba88837fa9d330e4341d9f72 # v1
        with:
          host-url: ${{ vars.SONAR_HOST_URL }}
          token: ${{ secrets.SONAR_TOKEN }}
          image: h3nc4/dev-base:debian-13@sha256:c78e86da85254b1d6f9278ddec16e0d8f9ebe008101b25182b7f8829df35548a
          script: /usr/local/bin/sonar
